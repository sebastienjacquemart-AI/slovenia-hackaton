<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Submission Review Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Submission Review Dashboard</h1>
<p class="subtitle">Load Jan's submission CSV and browse it in context, store × product at a time.</p>

<div class="card row">
  <div class="field">
    <label for="fileInput">Submission file (schema: id, sales_count_p25/p50/p75/p95)</label>
    <input type="file" id="fileInput" accept=".csv">
  </div>
  <div id="loadStatus" class="hint"></div>
</div>

<div class="card" id="validationCard" style="display:none">
  <div class="status-list" id="validationList"></div>
</div>

<div class="card" id="exceptionsCard" style="display:none">
  <div class="row" style="justify-content:space-between; align-items:baseline;">
    <strong id="exceptionsSummary"></strong>
    <div class="field" style="min-width:260px;">
      <label for="exceptionFilter">Filter</label>
      <select id="exceptionFilter"></select>
    </div>
  </div>
  <div class="table-wrap">
    <table class="exception-table" id="exceptionTable">
      <thead>
        <tr><th>Flag</th><th>Store</th><th>Product</th><th>Date</th><th>Detail</th><th></th></tr>
      </thead>
      <tbody id="exceptionTableBody"></tbody>
    </table>
  </div>
  <div class="hint" id="exceptionMoreHint"></div>
</div>

<div class="card row" style="align-items:flex-start;">
  <div class="field list-panel">
    <label for="storeSearch">Store</label>
    <input type="text" id="storeSearch" placeholder="Search id or city…">
    <div class="filter-row">
      <select id="storeCityFilter"><option value="">All cities</option></select>
      <select id="storeClusterFilter"><option value="">All clusters</option></select>
      <select id="storeFormatFilter"><option value="">All formats</option></select>
    </div>
    <div class="pick-list" id="storeList"><div class="hint">Loading…</div></div>
    <div class="info-panel" id="storeInfo"></div>
  </div>
  <div class="field list-panel">
    <label for="productSearch">Product</label>
    <input type="text" id="productSearch" placeholder="Search id or family…">
    <div class="filter-row">
      <select id="productFamilyFilter"><option value="">All families</option></select>
      <select id="productClassFilter"><option value="">All classes</option></select>
      <select id="productPerishableFilter">
        <option value="">Perishable: all</option>
        <option value="1">Perishable only</option>
        <option value="0">Non-perishable only</option>
      </select>
    </div>
    <div class="pick-list" id="productList"><div class="hint">Loading…</div></div>
    <div class="info-panel" id="productInfo"></div>
  </div>
</div>

<div class="card chart-wrap">
  <svg id="chart" width="820" height="340" viewBox="0 0 820 340"></svg>
  <div id="tooltip"></div>
  <div class="legend" id="legend"></div>
</div>

<script src="app.js"></script>
</body>
</html>
